name: One-time historical QA sample backfill

on:
  workflow_dispatch: {}   # manual only -- never runs on a schedule, see
                           # scripts/backfill_sample.py's docstring for why
                           # re-running this isn't safe once it's succeeded

permissions:
  contents: write

jobs:
  backfill-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run historical backfill
        env:
          PYTHONUNBUFFERED: "1"
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python scripts/backfill_sample.py

      - name: Commit seeded sample state
        if: always()
        run: |
          git config user.name "ticket-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/last_sample_window.json
          if git diff --quiet --cached; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Seed sample state after historical backfill"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "Pushed sample state."
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a race with another push) -- retrying..." >&2
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push sample state after 5 attempts." >&2
          exit 1
