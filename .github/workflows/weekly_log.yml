name: Weekly jbell ticket log

on:
  schedule:
    # 03:00 UTC Saturday = 11:00pm Friday US Eastern during EDT (UTC-4,
    # roughly mid-March to early November). During EST (UTC-5) this fires
    # at 10:00pm ET instead -- change to "0 4 * * 6" if you'd rather it
    # stay pinned to 11:00pm ET through the winter.
    - cron: "0 3 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit the updated state file

concurrency:
  group: weekly-log
  cancel-in-progress: false   # let an in-flight run finish rather than racing
                               # it on the state-file push

jobs:
  weekly-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly ticket log
        env:
          PYTHONUNBUFFERED: "1"
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TARGET_AGENT_EMAIL: ${{ secrets.TARGET_AGENT_EMAIL }}
        run: python scripts/weekly_log.py

      - name: Commit updated sync state
        if: always()   # persist progress even if the script errored partway through
        run: |
          git config user.name "ticket-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/last_weekly_sync.json
          if git diff --quiet --cached; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update weekly sync state"
          # See NXP_notebook's sync.yml for why this retries on rebase
          # conflict instead of failing outright: an overlapping manual
          # trigger, or a direct push to main mid-run, can advance
          # origin/main between checkout and push.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "Pushed sync state."
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a race with another push) -- retrying..." >&2
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push sync state after 5 attempts." >&2
          exit 1
