name: Biweekly jbell QA sample

on:
  schedule:
    # Same Friday-11pm-ET slot as weekly_log.yml (see that file for the
    # EDT/EST caveat) -- but this only actually samples every OTHER Friday.
    # GitHub Actions cron has no native "every 2 weeks" schedule, so this
    # fires weekly and scripts/biweekly_sample.py self-gates based on
    # ANCHOR_DATE (see that script's docstring).
    - cron: "10 3 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit the updated state file

concurrency:
  group: biweekly-sample
  cancel-in-progress: false

jobs:
  biweekly-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run biweekly QA sample
        env:
          PYTHONUNBUFFERED: "1"
          ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_API_TOKEN: ${{ secrets.ZENDESK_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TARGET_AGENT_EMAIL: ${{ secrets.TARGET_AGENT_EMAIL }}
        run: python scripts/biweekly_sample.py

      - name: Commit updated sync state
        if: always()
        run: |
          git config user.name "ticket-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/last_sample_window.json
          if git diff --quiet --cached; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update biweekly sample state"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "Pushed sample state."
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a race with another push) -- retrying..." >&2
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push sample state after 5 attempts." >&2
          exit 1
